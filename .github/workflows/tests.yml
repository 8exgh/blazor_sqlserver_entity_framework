name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: >
          dotnet test InvoiceRecon.Tests/InvoiceRecon.Tests.csproj
          --logger "trx;LogFileName=unit.trx" --results-directory test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  e2e-tests:
    name: Playwright e2e tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e stack
        run: >
          docker compose -f docker-compose.e2e.yml up
          --build --abort-on-container-exit --exit-code-from e2e

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
